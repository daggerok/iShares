<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iShares Excel .xls file to Watchlist</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico">

  <!-- Inter font (same as csv / youtube apps) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind (CDN, no build step — single index.html approach) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>

  <!-- Synchronous theme init (prevents flash, same strategy as csv app lazy init) -->
  <script>
    (function () {
      var dark = localStorage.getItem('ishares-theme') === 'dark'; // default: light (same as csv)
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.style.backgroundColor = dark ? '#020617' : '#f8fafc';
    })();
  </script>

  <style>
    @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    .animate-fade-in{animation:fadeIn .3s ease-out}

    /* Themed scrollbars (slate palette, same tokens as csv app .themed-scroll) */
    .themed-scroll::-webkit-scrollbar{width:10px;height:10px}
    .themed-scroll::-webkit-scrollbar-track{background:transparent}
    .themed-scroll::-webkit-scrollbar-thumb{background-color:#cbd5e1;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
    .themed-scroll::-webkit-scrollbar-thumb:hover{background-color:#94a3b8}
    .dark .themed-scroll::-webkit-scrollbar-thumb{background-color:#334155}
    .dark .themed-scroll::-webkit-scrollbar-thumb:hover{background-color:#475569}
    .themed-scroll::-webkit-scrollbar-corner{background:transparent}
    .themed-scroll{scrollbar-width:thin;scrollbar-color:#cbd5e1 transparent}
    .dark .themed-scroll{scrollbar-color:#334155 transparent}

    /* Dropzone interaction states (deterministic across light/dark) */
    .dz-active{border-color:#3b82f6;background:#eff6ff}
    .dark .dz-active{background:#1e293b}
    .dz-loaded{border-color:rgba(16,185,129,.5)}
    .dz-loaded .dz-label{color:#059669}
    .dark .dz-loaded .dz-label{color:#34d399}

    @keyframes tableRefresh{from{opacity:.32;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    #table-body.table-content-enter{animation:tableRefresh .22s ease-out}
    @media (prefers-reduced-motion:reduce){#table-body.table-content-enter{animation:none}}
  </style>
</head>
<body class="min-h-screen font-sans bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300">
  <div class="min-h-screen flex flex-col animate-fade-in">

    <!-- Header -->
    <header class="bg-white dark:bg-slate-950 border-b border-slate-200 dark:border-slate-800 px-4 sm:px-8 py-3 flex flex-wrap justify-between items-center gap-3 z-40 shadow-xs shrink-0">
      <div class="flex flex-1 flex-wrap items-center gap-x-3 gap-y-1.5 min-w-0">
        <div class="flex items-start gap-3 min-w-0">
          <svg class="w-6 h-6 text-blue-600 dark:text-blue-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M22 7l-8.5 8.5-5-5L2 17" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7h6v6" />
          </svg>
          <h1 class="min-w-0 text-xl font-bold tracking-tight text-slate-900 dark:text-white leading-tight">iShares Excel .xls file to Watchlist</h1>
        </div>
        <span class="basis-full sm:basis-auto text-sm text-slate-500 dark:text-slate-400">
          <span class="block sm:inline">· Upload SpreadsheetML (.xls) file from iShares.</span>
          <span class="block sm:inline"><span class="hidden sm:inline"> · </span><span class="sm:hidden">· </span>Example: open the
            <a href="https://www.ishares.com/us/products/291387/" target="_blank" rel="noopener noreferrer" class="font-semibold text-blue-600 dark:text-blue-400 hover:underline">DIVB</a>
            fund page and select
            <a href="https://www.blackrock.com/varnish-api/blk-one01-product-data/product-data/api/v1/get-fund-document?appType=PRODUCT_PAGE&amp;appSubType=ISHARES&amp;targetSite=us-ishares&amp;locale=en_US&amp;portfolioId=291387&amp;component=fundDownload&amp;userType=individual" target="_blank" rel="noopener noreferrer" class="font-semibold text-blue-600 dark:text-blue-400 hover:underline">Data Download</a>.
          </span>
        </span>
      </div>
      <div class="flex items-center gap-3 shrink-0">
        <span id="ticker-count" class="bg-blue-100 dark:bg-blue-900/50 text-blue-700 dark:text-blue-300 text-sm font-semibold px-3.5 py-1.5 rounded-full border border-blue-200 dark:border-blue-500/30">
          0 items
        </span>
        <button id="theme-toggle" class="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-700 transition text-base leading-none" title="Toggle Theme">🌙</button>
      </div>
    </header>

    <main class="flex-1 w-full max-w-full p-4 sm:p-8 space-y-6">

      <!-- Consolidated Search, Tabs & Action Bar -->
      <div class="flex flex-col lg:flex-row justify-between items-center gap-4 bg-white dark:bg-slate-800/80 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm backdrop-blur">

        <!-- Search Input (Left) -->
        <input
          type="text"
          id="search-input"
          placeholder="Search across all fields..."
          disabled
          class="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700 rounded-lg px-4 py-2 w-full lg:w-72 focus:outline-none focus:border-blue-500 text-sm placeholder-slate-400 dark:placeholder-slate-500 disabled:opacity-50 disabled:cursor-not-allowed shrink-0 transition"
        />

        <!-- Excel Worksheets / Tabs Bar (Centered in the middle) -->
        <div id="tabs-bar" class="hidden flex flex-wrap items-center justify-center gap-1.5 overflow-x-auto py-1 max-w-full flex-1 themed-scroll"></div>

        <!-- Action & Upload Buttons (Right) -->
        <div class="flex flex-wrap items-center gap-2.5 w-full lg:w-auto justify-end shrink-0">

          <!-- Integrated Drag & Drop Upload Button -->
          <div id="dropzone" class="flex items-center gap-2 border border-dashed border-slate-300 dark:border-slate-600 hover:border-blue-500 bg-slate-50 dark:bg-slate-900/60 transition-all rounded-lg px-3.5 py-2 cursor-pointer text-sm text-slate-600 dark:text-slate-300">
            <input type="file" id="file-input" accept=".xls,.xlsx,.xml,.csv" class="hidden" />
            <svg class="w-4 h-4 text-blue-500 dark:text-blue-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
            </svg>
            <span id="dropzone-text" class="dz-label font-medium">Upload / Drop .xls</span>
          </div>

          <!-- Copy Tickers Button -->
          <button id="copy-btn" disabled class="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-slate-200 dark:hover:bg-slate-700 disabled:hover:bg-slate-100 dark:disabled:hover:bg-slate-800">Copy Tickers</button>

          <!-- Export Actions -->
          <button id="export-csv-btn" disabled class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-blue-600">Export .csv</button>
          <button id="export-txt-btn" disabled class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-emerald-600">Export .txt</button>
          <button id="reset-btn" disabled class="bg-rose-100 dark:bg-rose-900/40 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-700/50 px-3 py-2 rounded-lg text-sm font-medium transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-rose-200 dark:hover:bg-rose-800/60 disabled:hover:bg-rose-100 dark:disabled:hover:bg-rose-900/40">Clear</button>
        </div>

      </div>

      <!-- Data Table Container -->
      <div class="bg-white dark:bg-slate-800/50 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm backdrop-blur overflow-hidden">
        <div id="table-scroll" class="max-h-[calc(100vh-220px)] overflow-x-auto overflow-y-auto themed-scroll">
          <table class="w-full text-left border-collapse whitespace-nowrap">
            <thead id="table-head" class="bg-slate-50 dark:bg-slate-900/95 text-slate-500 dark:text-slate-400 text-xs uppercase tracking-wider border-b border-slate-200 dark:border-slate-700 sticky top-0 z-20 backdrop-blur">
              <tr>
                <th class="py-3.5 px-4 w-12 text-center">#</th>
                <th class="py-3.5 px-4">Column 1</th>
              </tr>
            </thead>
            <tbody id="table-body" class="divide-y divide-slate-100 dark:divide-slate-700/50 text-sm">
              <tr>
                <td colspan="10" class="py-12 text-center text-slate-400 dark:text-slate-500">No file loaded yet. Upload an iShares .xls file above.</td>
              </tr>
            </tbody>
          </table>
          <div id="static-load-sentinel" class="hidden py-3 text-center text-xs text-slate-500 dark:text-slate-400" aria-live="polite">
            <span id="static-load-status"></span>
          </div>
        </div>
      </div>

    </main>

  </div>

  <script>
    // --- Theme and table preferences (persisted, same UX as csv / youtube apps) ---
    const THEME_KEY = 'ishares-theme';
    const SITE_STATE_KEY = 'ishares-site-state';
    const themeToggle = document.getElementById('theme-toggle');

    function applyTheme(dark) {
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.style.backgroundColor = dark ? '#020617' : '#f8fafc';
      themeToggle.textContent = dark ? '☀️' : '🌙';
      themeToggle.title = dark ? 'Switch to light theme' : 'Switch to dark theme';
    }

    applyTheme(localStorage.getItem(THEME_KEY) === 'dark'); // default: light (same as csv)

    themeToggle.addEventListener('click', () => {
      const dark = !document.documentElement.classList.contains('dark');
      localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light');
      applyTheme(dark);
    });

    // --- IndexedDB Wrapper ---
    const DB_NAME = 'iSharesWatchlistDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'app_state';

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function dbSet(key, val) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(val, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function dbGet(key) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbClear() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).clear();
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    // --- State ---
    let workbookSheets = {};
    let activeSheetName = '';
    let currentFileName = '';
    let staticFunds = {};
    let staticPagesBySheet = {};
    let staticNextPageBySheet = {};
    let staticLoadingSheets = new Set();
    let staticPagingGeneration = 0;
    let staticTicker = '';
    let restoredSortKey = '';
    let restoredSortDir = 'asc';
    // Current table order. Data stays intact; only the displayed rows are sorted.
    let sortKey = '';
    let sortDir = 'asc';
    let restoredQuery = '';

    const dropzone = document.getElementById('dropzone');
    const dropzoneText = document.getElementById('dropzone-text');
    const fileInput = document.getElementById('file-input');
    const tabsBar = document.getElementById('tabs-bar');
    const tableHead = document.getElementById('table-head');
    const tableBody = document.getElementById('table-body');
    const tickerCount = document.getElementById('ticker-count');
    const searchInput = document.getElementById('search-input');
    const tableScroll = document.getElementById('table-scroll');
    const staticLoadSentinel = document.getElementById('static-load-sentinel');
    const staticLoadStatus = document.getElementById('static-load-status');

    const copyBtn = document.getElementById('copy-btn');
    const exportCsvBtn = document.getElementById('export-csv-btn');
    const exportTxtBtn = document.getElementById('export-txt-btn');
    const resetBtn = document.getElementById('reset-btn');

    document.addEventListener('DOMContentLoaded', async () => {
      restoreSiteState();
      try {
        const savedWorkbook = await dbGet('workbook');
        const savedFilename = await dbGet('filename');
        const savedActiveTab = await dbGet('active_tab');

        if (savedWorkbook) {
          workbookSheets = savedWorkbook;
          currentFileName = savedFilename || '';
          const sheetNames = Object.keys(workbookSheets);

          if (sheetNames.length > 0) {
            activeSheetName = (savedActiveTab && workbookSheets[savedActiveTab]) ? savedActiveTab : getDefaultTabName(sheetNames);
            renderTabs();
            await switchSheet(activeSheetName);
            applyRestoredSiteState();
            enableControls(currentFileName || 'Restored from cache');
          }
        } else {
          await loadStaticCatalog();
        }
      } catch (e) {
        console.error('Failed to load from IndexedDB', e);
      }
    });

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', (e) => { 
      e.preventDefault(); 
      dropzone.classList.add('dz-active'); 
    });
    dropzone.addEventListener('dragleave', () => {
      dropzone.classList.remove('dz-active');
    });
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dz-active');
      if (e.dataTransfer.files.length) processFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => { 
      if (e.target.files.length) processFile(e.target.files[0]); 
    });

    async function loadStaticCatalog() {
      try {
        const response = await fetch('./api/ishares/index.json', { cache: 'no-cache' });
        if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
        const index = await response.json();
        staticTicker = '';
        resetStaticPaging();
        staticFunds = Object.fromEntries((index.funds || []).map(fund => [fund.ticker, fund]));
        const formatPercent = value => {
          if (value === null || value === undefined || value === '') return '—';
          const number = Number(value);
          return Number.isFinite(number) ? number.toFixed(2) : String(value);
        };
        workbookSheets = {
          'ETF Catalog': {
            headers: ['Ticker', 'Fund Name', 'Type', 'Net Assets', 'Expense', 'Dividend Yield', 'YTD Return', 'TR 1Y', 'TR 3Y', 'TR 5Y', 'TR 10Y', 'CAGR 3Y', 'CAGR 5Y', 'CAGR 10Y', 'Return As Of', 'Inception', 'Holdings', 'History', 'As Of'],
            data: (index.funds || []).map(fund => {
              const totalReturn = fund.totalReturn || {};
              const performance = fund.performance || {};
              return {
                Ticker: fund.ticker,
                'Fund Name': fund.name,
                Type: fund.type || 'iShares ETF',
                'Net Assets': fund.netAssets || '—',
                Expense: fund.netExpenseRatio || fund.grossExpenseRatio || '—',
                'Dividend Yield': fund.trailingYield || '—',
                'YTD Return': formatPercent(totalReturn.YTD ?? fund.ytdReturn),
                'TR 1Y': formatPercent(totalReturn['1Y']),
                'TR 3Y': formatPercent(totalReturn['3Y']),
                'TR 5Y': formatPercent(totalReturn['5Y']),
                'TR 10Y': formatPercent(totalReturn['10Y']),
                'CAGR 3Y': formatPercent(performance['3Y']),
                'CAGR 5Y': formatPercent(performance['5Y']),
                'CAGR 10Y': formatPercent(performance['10Y']),
                'Return As Of': totalReturn.asOfDate || fund.returnAsOf || '—',
                Inception: fund.inceptionDate || '—',
                Holdings: fund.holdings || '—',
                History: fund.history || '—',
                'As Of': fund.asOfDate || fund.yieldAsOf || '—',
              };
            }),
            tickerCol: 'Ticker',
          },
        };
        currentFileName = 'iShares static data';
        activeSheetName = 'ETF Catalog';
        renderTabs();
        await switchSheet(activeSheetName);
        applyRestoredSiteState();
        enableControls(currentFileName);
      } catch (error) {
        console.info('Static iShares data is unavailable; upload an .xls file to begin.', error);
      }
    }

    async function fetchStaticPage(ticker, pagePath) {
      const path = String(pagePath).replace(/^\.\/+/, '');
      const response = await fetch(`./api/ishares/funds/${encodeURIComponent(ticker)}/${path}`, { cache: 'no-cache' });
      if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      return response.json();
    }

    function staticSheet(sheet) {
      const headers = Array.isArray(sheet?.headers) ? sheet.headers : [];
      const data = Array.isArray(sheet?.rows) ? sheet.rows : [];
      return {
        headers,
        data,
        tickerCol: headers.find(header => /^ticker$/i.test(header)) || null,
      };
    }

    function resetStaticPaging() {
      staticPagingGeneration += 1;
      staticPagesBySheet = {};
      staticNextPageBySheet = {};
      staticLoadingSheets = new Set();
    }

    function renderStaticLoadSentinel() {
      const pages = staticPagesBySheet[activeSheetName] || [];
      const nextPage = staticNextPageBySheet[activeSheetName] || 0;
      const loading = staticLoadingSheets.has(activeSheetName);
      const visible = loading || nextPage < pages.length;
      staticLoadSentinel.classList.toggle('hidden', !visible);
      staticLoadStatus.textContent = loading ? 'Loading more rows…' : '';
    }

    async function loadNextStaticSheetPage(sheetName) {
      const pages = staticPagesBySheet[sheetName];
      const nextPage = staticNextPageBySheet[sheetName] || 0;
      if (!staticTicker || !pages || !pages[nextPage] || staticLoadingSheets.has(sheetName)) {
        if (sheetName === activeSheetName) renderStaticLoadSentinel();
        return;
      }

      const generation = staticPagingGeneration;
      const ticker = staticTicker;
      staticLoadingSheets.add(sheetName);
      if (sheetName === activeSheetName) renderStaticLoadSentinel();
      try {
        const loaded = staticSheet(await fetchStaticPage(ticker, pages[nextPage]));
        if (generation !== staticPagingGeneration || ticker !== staticTicker) return;
        const current = workbookSheets[sheetName] || staticSheet(loaded);
        current.data = current.data.concat(loaded.data);
        if (!current.headers.length) current.headers = loaded.headers;
        if (!current.tickerCol) current.tickerCol = loaded.tickerCol;
        workbookSheets[sheetName] = current;
        staticNextPageBySheet[sheetName] = nextPage + 1;
        if (sheetName === activeSheetName) {
          renderTable(getFilteredRows(current), current.headers);
        }
      } catch (error) {
        if (generation === staticPagingGeneration) {
          console.error(`Failed to load ${sheetName} page ${nextPage + 1}`, error);
        }
      } finally {
        if (generation !== staticPagingGeneration) return;
        staticLoadingSheets.delete(sheetName);
        if (sheetName === activeSheetName) renderStaticLoadSentinel();
      }
    }

    function maybeLoadMoreStaticRows() {
      const pages = staticPagesBySheet[activeSheetName] || [];
      const nextPage = staticNextPageBySheet[activeSheetName] || 0;
      if (!tableScroll || !pages[nextPage] || staticLoadingSheets.has(activeSheetName)) return;
      const distanceToBottom = tableScroll.scrollHeight - tableScroll.scrollTop - tableScroll.clientHeight;
      if (distanceToBottom < 600) void loadNextStaticSheetPage(activeSheetName);
    }

    async function loadStaticFund(ticker) {
      const fund = staticFunds[ticker];
      if (!fund) return;
      const response = await fetch(`./api/ishares/funds/${encodeURIComponent(ticker)}/meta.json`, { cache: 'no-cache' });
      if (!response.ok) return;
      const data = await response.json();
      staticTicker = ticker;
      resetStaticPaging();

      workbookSheets = Object.fromEntries(Object.entries(data.worksheets || {}).map(([name, sheet]) => [name, staticSheet(sheet)]));
      const pageManifests = {
        Holdings: data.holdings,
        Historical: data.history || data.historical,
      };
      for (const [sheetName, manifest] of Object.entries(pageManifests)) {
        if (!manifest || !Array.isArray(manifest.pages) || !manifest.pages.length) continue;
        staticPagesBySheet[sheetName] = manifest.pages;
        staticNextPageBySheet[sheetName] = 0;
        workbookSheets[sheetName] = staticSheet(await fetchStaticPage(ticker, manifest.pages[0]));
        staticNextPageBySheet[sheetName] = 1;
      }

      activeSheetName = getDefaultTabName(Object.keys(workbookSheets));
      currentFileName = `${ticker} static data`;
      searchInput.value = '';
      renderTabs();
      await switchSheet(activeSheetName);
      renderStaticLoadSentinel();
      enableControls(currentFileName);
    }

    const staticLoadObserver = typeof IntersectionObserver === 'function'
      ? new IntersectionObserver((entries) => {
          if (entries.some(entry => entry.isIntersecting)) void loadNextStaticSheetPage(activeSheetName);
        }, { root: tableScroll, rootMargin: '600px 0px' })
      : null;
    staticLoadObserver?.observe(staticLoadSentinel);
    tableScroll.addEventListener('scroll', maybeLoadMoreStaticRows, { passive: true });
    staticLoadSentinel.addEventListener('click', () => void loadNextStaticSheetPage(activeSheetName));

    function restoreSiteState() {
      try {
        const saved = JSON.parse(localStorage.getItem(SITE_STATE_KEY) || '{}');
        restoredSortKey = typeof saved.sortKey === 'string' ? saved.sortKey : '';
        restoredSortDir = saved.sortDir === 'desc' ? 'desc' : 'asc';
        restoredQuery = typeof saved.query === 'string' ? saved.query : '';
      } catch { /* no saved state */ }
    }

    function applyRestoredSiteState() {
      const currentSheet = workbookSheets[activeSheetName];
      sortKey = restoredSortKey;
      sortDir = restoredSortDir;
      searchInput.value = restoredQuery;
      if (!currentSheet) return;
      if (sortKey && !currentSheet.headers.includes(sortKey)) {
        sortKey = '';
        sortDir = 'asc';
      }
      renderTable(getFilteredRows(currentSheet), currentSheet.headers);
      renderStaticLoadSentinel();
    }

    function persistSiteState() {
      localStorage.setItem(SITE_STATE_KEY, JSON.stringify({ sortKey, sortDir, query: searchInput.value }));
    }

    function getDefaultTabName(sheetNames) {
      const holdingsTab = sheetNames.find(name => /^holdings$/i.test(name.trim()));
      return holdingsTab || sheetNames[0];
    }

    function processFile(file) {
      staticTicker = '';
      resetStaticPaging();
      currentFileName = file.name;
      const reader = new FileReader();
      reader.onload = async (e) => {
        const xmlContent = e.target.result;
        workbookSheets = {};

        const worksheetMatches = Array.from(xmlContent.matchAll(/<ss:Worksheet\s+ss:Name="([^"]+)"[\s\S]*?>([\s\S]*?)<\/ss:Worksheet>/gi));

        if (worksheetMatches.length > 0) {
          worksheetMatches.forEach(match => {
            const sheetName = match[1].trim();
            const sheetXml = match[2];
            parseSheetXml(sheetName, sheetXml);
          });
        } else {
          parseSheetXml('Holdings', xmlContent);
        }

        const sheetNames = Object.keys(workbookSheets);
        if (sheetNames.length > 0) {
          activeSheetName = getDefaultTabName(sheetNames);

          await dbSet('workbook', workbookSheets);
          await dbSet('filename', currentFileName);
          await dbSet('active_tab', activeSheetName);

          renderTabs();
          switchSheet(activeSheetName);
          enableControls(currentFileName);
        }
      };

      reader.readAsText(file);
    }

    function parseSheetXml(sheetName, sheetXml) {
      const rowMatches = sheetXml.match(/<ss:Row[\s\S]*?<\/ss:Row>/gi) || [];
      let rawRows = [];

      rowMatches.forEach(rowXml => {
        const dataMatches = Array.from(rowXml.matchAll(/<ss:Data[^>]*>([\s\S]*?)<\/ss:Data>/gi))
          .map(m => m[1].trim());

        // Отсекаем полностью пустые строки
        if (dataMatches.some(v => v.length > 0)) {
          rawRows.push(dataMatches);
        }
      });

      if (rawRows.length === 0) {
        workbookSheets[sheetName] = { headers: [], data: [], tickerCol: null };
        return;
      }

      // Определяем максимальное число колонок среди всех строк вкладки
      let maxCols = Math.max(...rawRows.map(r => r.length));

      // Проверяем, есть ли явная строка с заголовком Ticker
      let tickerRowIdx = rawRows.findIndex(r => r.some(v => /^ticker$/i.test(v)));
      let headers = [];
      let dataRows = [];

      if (tickerRowIdx !== -1) {
        headers = Array.from({ length: maxCols }, (_, idx) => rawRows[tickerRowIdx][idx] || `Column ${idx + 1}`);
        dataRows = rawRows.slice(tickerRowIdx + 1);
      } else {
        // Если Ticker не найден (как в Performance/Distributions), пытаемся найти первую многоколоночную строку
        let firstMultiColIdx = rawRows.findIndex(r => r.length > 1);
        
        if (firstMultiColIdx !== -1 && rawRows[firstMultiColIdx].some(v => isNaN(v))) {
          headers = Array.from({ length: maxCols }, (_, idx) => rawRows[firstMultiColIdx][idx] || `Column ${idx + 1}`);
          dataRows = rawRows.slice(firstMultiColIdx + 1);
        } else {
          headers = Array.from({ length: maxCols }, (_, idx) => `Column ${idx + 1}`);
          dataRows = rawRows;
        }
      }

      let tickerColIndex = headers.findIndex(h => /^ticker$/i.test(h));
      let tickerCol = tickerColIndex !== -1 ? headers[tickerColIndex] : null;

      let parsedData = [];

      dataRows.forEach(row => {
        const rowObj = {};
        let hasValue = false;

        headers.forEach((h, idx) => {
          const val = row[idx] || '';
          rowObj[h] = val;
          if (val) hasValue = true;
        });

        if (hasValue) {
          parsedData.push(rowObj);
        }
      });

      // Фильтрация дедупликация тикеров выполняет только при наличии колонки Ticker
      if (tickerCol) {
        const seen = new Set();
        parsedData = parsedData.filter(item => {
          const val = item[tickerCol];
          if (!val || !/^[A-Z0-9]+$/.test(val) || ['USD', 'XTSLA'].includes(val)) return false;
          const duplicate = seen.has(val);
          seen.add(val);
          return !duplicate;
        });
      }

      workbookSheets[sheetName] = { headers, data: parsedData, tickerCol };
    }

    function renderTabs() {
      const sheetNames = Object.keys(workbookSheets);
      if (sheetNames.length <= 1) {
        tabsBar.classList.add('hidden');
        return;
      }

      tabsBar.classList.remove('hidden');
      tabsBar.innerHTML = sheetNames.map(name => {
        const isActive = name === activeSheetName;
        const activeClasses = "bg-blue-600 text-white font-medium border-blue-500 shadow-sm";
        const inactiveClasses = "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 hover:bg-slate-200 dark:hover:bg-slate-700 border-slate-200 dark:border-slate-700";

        return `
          <button 
            onclick="switchSheet('${name.replace(/'/g, "\\'")}')" 
            class="px-3.5 py-1.5 rounded-full text-xs transition border whitespace-nowrap ${isActive ? activeClasses : inactiveClasses}">
            ${name}
          </button>
        `;
      }).join('');
    }

    async function switchSheet(sheetName) {
      if (!workbookSheets[sheetName]) return;
      activeSheetName = sheetName;
      // Each worksheet can have different columns, so start its table in source order.
      sortKey = '';
      sortDir = 'asc';
      await dbSet('active_tab', activeSheetName);

      renderTabs();
      
      const currentSheet = workbookSheets[activeSheetName];
      renderTable(getFilteredRows(currentSheet), currentSheet.headers);
      renderStaticLoadSentinel();

      const hasTickerCol = Boolean(currentSheet.tickerCol);
      copyBtn.disabled = !hasTickerCol;

      if (!hasTickerCol) {
        copyBtn.title = "Current tab does not contain a Ticker column";
      } else {
        copyBtn.removeAttribute('title');
      }

      // Кнопки экспорта CSV/TXT остаются активными для любых вкладок с данными
      const hasData = currentSheet.data.length > 0;
      exportCsvBtn.disabled = !hasData;
      exportTxtBtn.disabled = !hasData;
    }

    function enableControls(fileName) {
      dropzoneText.textContent = fileName.length > 20 ? fileName.slice(0, 17) + '...' : fileName;
      dropzone.classList.add('dz-loaded');

      searchInput.disabled = false;
      resetBtn.disabled = false;
    }

    async function clearStorage() {
      resetBtn.disabled = true;
      try {
        await dbClear();
      } catch (error) {
        console.error('Failed to clear cached workbook', error);
      } finally {
        // Reload so the catalog is initialized again and the controls are
        // immediately usable after Clear; the theme and sort preferences stay.
        window.location.reload();
      }
    }

    function animateTableUpdate() {
      tableBody.classList.remove('table-content-enter');
      void tableBody.offsetWidth;
      tableBody.classList.add('table-content-enter');
    }

    function renderTable(data, headers = []) {
      const currentSheet = workbookSheets[activeSheetName];
      const sortedData = sortRows(data);
      const count = sortedData.length;
      tickerCount.textContent = `${count} ${currentSheet?.tickerCol ? 'tickers' : 'items'}`;

      if (headers.length > 0) {
        tableHead.innerHTML = `
          <tr>
            <th class="py-3.5 px-4 w-12 text-center">#</th>
            ${headers.map(header => sortHeader(header)).join('')}
          </tr>
        `;
        bindSortHeaders();
      }

      if (!sortedData.length) {
        tableBody.innerHTML = `<tr><td colspan="${headers.length + 1}" class="py-8 text-center text-slate-400 dark:text-slate-500">No matching items found.</td></tr>`;
        animateTableUpdate();
        return;
      }

      tableBody.innerHTML = sortedData.map((item, idx) => `
        <tr data-static-ticker="${activeSheetName === 'ETF Catalog' ? escapeHtml(item.Ticker || '') : ''}" class="hover:bg-slate-50 dark:hover:bg-slate-700/30 transition border-b border-slate-100 dark:border-slate-700/30">
          <td class="py-2.5 px-4 text-slate-400 dark:text-slate-500 text-xs text-center font-mono">${idx + 1}</td>
          ${headers.map((header, index) => {
            const value = item[header] || '';
            if (index === 0 && currentSheet?.tickerCol) {
              return `<td class="py-2.5 px-4 font-mono font-semibold text-blue-600 dark:text-blue-400">${escapeHtml(value)}</td>`;
            }
            return `<td class="py-2.5 px-4 text-slate-700 dark:text-slate-300 font-medium">${escapeHtml(value)}</td>`;
          }).join('')}
        </tr>
      `).join('');
      tableBody.querySelectorAll('tr[data-static-ticker]').forEach(row => {
        row.addEventListener('click', () => { if (row.dataset.staticTicker) void loadStaticFund(row.dataset.staticTicker); });
      });
      animateTableUpdate();
    }

    function sortHeader(header) {
      const active = sortKey === header;
      const arrow = active ? (sortDir === 'asc' ? ' ↑' : ' ↓') : '';
      return `<th class="py-3.5 px-4"><button data-sort="${escapeHtml(header)}" class="uppercase tracking-wider hover:text-blue-600 dark:hover:text-blue-400 focus:outline-none focus:text-blue-600 dark:focus:text-blue-400">${escapeHtml(header)}${arrow}</button></th>`;
    }

    function bindSortHeaders() {
      tableHead.querySelectorAll('button[data-sort]').forEach(button => {
        button.addEventListener('click', () => {
          const key = button.dataset.sort || '';
          if (!key) return;
          if (sortKey === key) {
            sortDir = sortDir === 'asc' ? 'desc' : 'asc';
          } else {
            sortKey = key;
            sortDir = isNumericColumn(key) ? 'desc' : 'asc';
          }
          persistSiteState();
          const currentSheet = workbookSheets[activeSheetName];
          if (currentSheet) renderTable(getFilteredRows(currentSheet), currentSheet.headers);
        });
      });
    }

    function getFilteredRows(sheet) {
      const query = searchInput.value.toLowerCase().trim();
      if (!query) return sheet.data;
      return sheet.data.filter(row => Object.values(row).some(value => String(value).toLowerCase().includes(query)));
    }

    function isNumericColumn(key) {
      const sheet = workbookSheets[activeSheetName];
      if (!sheet) return false;
      const values = sheet.data.map(row => row[key]).filter(value => String(value ?? '').trim() !== '');
      return values.length > 0 && values.every(value => sortableNumber(value) !== null);
    }

    function sortRows(rows) {
      if (!sortKey) return [...rows];
      const direction = sortDir === 'asc' ? 1 : -1;
      return [...rows].sort((left, right) => compareSortableValues(left[sortKey], right[sortKey]) * direction);
    }

    function compareSortableValues(left, right) {
      const leftNumber = sortableNumber(left);
      const rightNumber = sortableNumber(right);
      if (leftNumber !== null && rightNumber !== null) return leftNumber === rightNumber ? 0 : leftNumber > rightNumber ? 1 : -1;
      return String(left ?? '').localeCompare(String(right ?? ''), undefined, { numeric: true, sensitivity: 'base' });
    }

    function sortableNumber(value) {
      const source = String(value ?? '').trim();
      if (!source) return null;
      const normalized = source
        .replace(/^\((.*)\)$/, '-$1')
        .replace(/[$,%]/g, '')
        .replace(/,/g, '')
        .trim();
      return /^-?(?:\d+|\d*\.\d+)$/.test(normalized) ? Number(normalized) : null;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
    }

    function getExportFileName(targetExtension) {
      if (!currentFileName) return `iShares_Watchlist.${targetExtension}`;
      const lastDotIndex = currentFileName.lastIndexOf('.');
      const baseName = lastDotIndex !== -1 ? currentFileName.substring(0, lastDotIndex) : currentFileName;
      return `${baseName}_${activeSheetName}.${targetExtension}`;
    }

    function generateFileContent() {
      const currentSheet = workbookSheets[activeSheetName];
      if (!currentSheet) return '';
      
      const csvHeaders = currentSheet.headers.join(',');
      const csvRows = currentSheet.data.map(row => 
        currentSheet.headers.map(h => `"${(row[h] || '').replace(/"/g, '""')}"`).join(',')
      );
      return [csvHeaders, ...csvRows].join("\n");
    }

    searchInput.addEventListener('input', (e) => {
      persistSiteState();
      const currentSheet = workbookSheets[activeSheetName];
      if (!currentSheet) return;

      renderTable(getFilteredRows(currentSheet), currentSheet.headers);
    });

    exportCsvBtn.addEventListener('click', () => {
      const content = generateFileContent();
      const blob = new Blob([content], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", getExportFileName('csv'));
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    exportTxtBtn.addEventListener('click', () => {
      const content = generateFileContent();
      const blob = new Blob([content], { type: "text/plain;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", getExportFileName('txt'));
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    copyBtn.addEventListener('click', () => {
      const currentSheet = workbookSheets[activeSheetName];
      if (!currentSheet || !currentSheet.tickerCol) return;

      const tickersText = currentSheet.data.map(e => e[currentSheet.tickerCol]).filter(Boolean).join(', ');
      navigator.clipboard.writeText(tickersText);
      alert(`${currentSheet.data.length} tickers copied to clipboard!`);
    });

    resetBtn.addEventListener('click', clearStorage);
  </script>
</body>
</html>
